<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- CRT scanlines: 2px transparent / 2px dark, matching body::before in globals.css -->
    <pattern id="scanlines" x="0" y="0" width="512" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="512" height="2" fill="transparent"/>
      <rect x="0" y="2" width="512" height="2" fill="rgba(0,0,0,0.12)"/>
    </pattern>
    <!-- Glow filters for severity 3, matching boxShadow: 0 0 6px hexToRgba(color, 0.7) -->
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#ff4466" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#00f5ff" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0f"/>

  <!--
    4×4 heatmap grid — mirrors squareStyle() from dot-input.tsx exactly:
      severity 0: no fill, stroke at color 35% opacity
      severity 1: fill at 35% + solid stroke at full color
      severity 2: fill at 65% + solid stroke at full color
      severity 3: fill at 100% + solid stroke at full color + glow
    Cols (L→R): Red Meat #ff4466 / Poultry #ff8833 / Fish #00f5ff / Alcohol #cc66ff
    Rows (T→B, oldest→newest): [0,1,0,1] / [1,0,2,0] / [2,1,1,2] / [3,2,3,1]
    cell=96, gap=16, offset=40
  -->

  <!-- Row 1: [0, 1, 0, 1] -->
  <rect x="40"  y="40"  width="96" height="96" fill="none"     stroke="#ff4466" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="152" y="40"  width="96" height="96" fill="#ff8833"  fill-opacity="0.35" stroke="#ff8833"  stroke-width="2"/>
  <rect x="264" y="40"  width="96" height="96" fill="none"     stroke="#00f5ff" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="376" y="40"  width="96" height="96" fill="#cc66ff"  fill-opacity="0.35" stroke="#cc66ff"  stroke-width="2"/>

  <!-- Row 2: [1, 0, 2, 0] -->
  <rect x="40"  y="152" width="96" height="96" fill="#ff4466"  fill-opacity="0.35" stroke="#ff4466"  stroke-width="2"/>
  <rect x="152" y="152" width="96" height="96" fill="none"     stroke="#ff8833" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="264" y="152" width="96" height="96" fill="#00f5ff"  fill-opacity="0.65" stroke="#00f5ff"  stroke-width="2"/>
  <rect x="376" y="152" width="96" height="96" fill="none"     stroke="#cc66ff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Row 3: [2, 1, 1, 2] -->
  <rect x="40"  y="264" width="96" height="96" fill="#ff4466"  fill-opacity="0.65" stroke="#ff4466"  stroke-width="2"/>
  <rect x="152" y="264" width="96" height="96" fill="#ff8833"  fill-opacity="0.35" stroke="#ff8833"  stroke-width="2"/>
  <rect x="264" y="264" width="96" height="96" fill="#00f5ff"  fill-opacity="0.35" stroke="#00f5ff"  stroke-width="2"/>
  <rect x="376" y="264" width="96" height="96" fill="#cc66ff"  fill-opacity="0.65" stroke="#cc66ff"  stroke-width="2"/>

  <!-- Row 4 (most recent): [3, 2, 3, 1] -->
  <rect x="40"  y="376" width="96" height="96" fill="#ff4466"  stroke="#ff4466" stroke-width="2" filter="url(#glow-red)"/>
  <rect x="152" y="376" width="96" height="96" fill="#ff8833"  fill-opacity="0.65" stroke="#ff8833"  stroke-width="2"/>
  <rect x="264" y="376" width="96" height="96" fill="#00f5ff"  stroke="#00f5ff" stroke-width="2" filter="url(#glow-cyan)"/>
  <rect x="376" y="376" width="96" height="96" fill="#cc66ff"  fill-opacity="0.35" stroke="#cc66ff"  stroke-width="2"/>

  <!-- CRT scanline overlay (on top of everything) -->
  <rect width="512" height="512" fill="url(#scanlines)"/>

  <!-- Pixel border frame -->
  <rect x="2" y="2" width="508" height="508" fill="none" stroke="#3d3d6b" stroke-width="4"/>
</svg>
