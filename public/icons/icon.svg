<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="rounded"><rect width="512" height="512" rx="120"/></clipPath>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feFlood flood-color="#00f5ff" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="512" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="512" height="2" fill="transparent"/>
      <rect x="0" y="2" width="512" height="2" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Background -->
    <rect width="512" height="512" fill="#1a1a2e"/>
    <!-- Left: dim -->
    <rect x="60" y="166" width="180" height="180"
      fill="#00f5ff" fill-opacity="0.35"
      stroke="#00f5ff" stroke-opacity="0.5" stroke-width="4"/>
    <!-- Right: bright -->
    <rect x="272" y="166" width="180" height="180"
      fill="#00f5ff" stroke="#00f5ff" stroke-width="4"
      filter="url(#glow-cyan)"/>
    <!-- CRT scanline overlay -->
    <rect width="512" height="512" fill="url(#scanlines)"/>
  </g>
</svg>
