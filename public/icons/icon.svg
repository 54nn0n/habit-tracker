<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#ff4466" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#ff8833" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#00f5ff" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#cc66ff" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="scanlines" x="0" y="0" width="512" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="512" height="2" fill="transparent"/>
      <rect x="0" y="2" width="512" height="2" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0f"/>

  <!-- Row 0 -->
  <!-- (0,0) red bright -->
  <rect x="56" y="56" width="120" height="120" fill="#ff4466" stroke="#ff4466" stroke-width="4" filter="url(#glow-red)"/>
  <!-- (0,1) orange dim -->
  <rect x="196" y="56" width="120" height="120" fill="#ff8833" fill-opacity="0.35" stroke="#ff8833" stroke-opacity="0.5" stroke-width="3"/>
  <!-- (0,2) purple bright -->
  <rect x="336" y="56" width="120" height="120" fill="#cc66ff" stroke="#cc66ff" stroke-width="4" filter="url(#glow-purple)"/>

  <!-- Row 1 -->
  <!-- (1,0) cyan dim -->
  <rect x="56" y="196" width="120" height="120" fill="#00f5ff" fill-opacity="0.35" stroke="#00f5ff" stroke-opacity="0.5" stroke-width="3"/>
  <!-- (1,1) red bright -->
  <rect x="196" y="196" width="120" height="120" fill="#ff4466" stroke="#ff4466" stroke-width="4" filter="url(#glow-red)"/>
  <!-- (1,2) orange bright -->
  <rect x="336" y="196" width="120" height="120" fill="#ff8833" stroke="#ff8833" stroke-width="4" filter="url(#glow-orange)"/>

  <!-- Row 2 -->
  <!-- (2,0) purple dim -->
  <rect x="56" y="336" width="120" height="120" fill="#cc66ff" fill-opacity="0.35" stroke="#cc66ff" stroke-opacity="0.5" stroke-width="3"/>
  <!-- (2,1) cyan bright -->
  <rect x="196" y="336" width="120" height="120" fill="#00f5ff" stroke="#00f5ff" stroke-width="4" filter="url(#glow-cyan)"/>
  <!-- (2,2) orange dim -->
  <rect x="336" y="336" width="120" height="120" fill="#ff8833" fill-opacity="0.35" stroke="#ff8833" stroke-opacity="0.5" stroke-width="3"/>

  <!-- CRT scanline overlay -->
  <rect width="512" height="512" fill="url(#scanlines)"/>
</svg>
